<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TGProxy · Telegram 代理控制台</title>
<style>
  :root {
    --bg: #f5f6f8;
    --panel: #ffffff;
    --border: #e4e7ec;
    --border-strong: #d3d8e0;
    --text: #101828;
    --text-2: #475467;
    --muted: #98a2b3;
    --accent: #2563eb;
    --accent-soft: #eff4ff;
    --green: #16a34a;
    --green-soft: #ecfdf3;
    --amber: #d97706;
    --amber-soft: #fffaeb;
    --red: #dc2626;
    --red-soft: #fef3f2;
    --radius: 12px;
    --shadow: 0 1px 2px rgba(16, 24, 40, .05);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 14px/1.5 -apple-system, "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  button, input { font: inherit; }
  .muted { color: var(--muted); }
  .num { font-variant-numeric: tabular-nums; }

  /* ---------- 布局 ---------- */
  .app {
    display: grid;
    grid-template-columns: 232px minmax(0, 1fr) 348px;
    gap: 16px;
    padding: 16px;
    height: 100vh;
    align-items: stretch;
  }
  .col {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    min-height: 0;
    display: flex;
    flex-direction: column;
  }
  .col-left { padding: 16px; gap: 16px; }
  .col-main { overflow: hidden; }
  .col-right { padding: 14px; gap: 14px; overflow-y: auto; }

  /* 断点：1360 以下右栏进抽屉（此处直接隐藏并给按钮），<900 单列 */
  @media (max-width: 1359px) {
    .app { grid-template-columns: 208px minmax(0, 1fr); }
    .col-right { display: none; }
    .app.show-right { grid-template-columns: 208px minmax(0, 1fr) 320px; }
    .app.show-right .col-right { display: flex; }
  }
  @media (max-width: 899px) {
    .app { grid-template-columns: minmax(0, 1fr); height: auto; }
    .col-left { flex-direction: row; flex-wrap: wrap; align-items: center; }
    .col-main { min-height: 70vh; }
  }

  /* ---------- 左栏 ---------- */
  .brand { display: flex; align-items: baseline; gap: 8px; }
  .brand-name { font-size: 16px; font-weight: 650; letter-spacing: .2px; }
  .brand-ver {
    font-size: 11px; color: var(--text-2); background: var(--bg);
    border: 1px solid var(--border); border-radius: 999px; padding: 1px 7px;
  }
  .status-pill {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 5px 10px; border-radius: 999px; font-size: 12px; font-weight: 550;
    background: var(--bg); color: var(--text-2); border: 1px solid var(--border);
    align-self: flex-start;
  }
  .status-pill .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
  .status-pill.running { background: var(--accent-soft); color: #1d4ed8; border-color: #c7d7fe; }
  .status-pill.running .dot { background: var(--accent); animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .25 } }

  .side-block { display: flex; flex-direction: column; gap: 6px; }
  .side-label { font-size: 11px; letter-spacing: .4px; text-transform: uppercase; color: var(--muted); }
  .big-num { font-size: 34px; font-weight: 680; line-height: 1.1; letter-spacing: -.5px; }
  .big-sub { font-size: 12px; color: var(--text-2); }
  .kv { display: flex; justify-content: space-between; gap: 8px; font-size: 12.5px; }
  .kv .k { color: var(--text-2); }
  .spacer { flex: 1 1 auto; }

  /* ---------- 按钮 ---------- */
  .btn {
    appearance: none; cursor: pointer; border-radius: 9px;
    border: 1px solid var(--border-strong); background: #fff; color: var(--text);
    padding: 7px 12px; font-size: 13px; transition: background .12s, border-color .12s;
  }
  .btn:hover:not(:disabled) { background: #f9fafb; }
  .btn:disabled { opacity: .55; cursor: not-allowed; }
  .btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn-primary:hover:not(:disabled) { background: #1d4ed8; }
  .btn-ghost { border-color: transparent; color: var(--text-2); }
  .btn-ghost:hover:not(:disabled) { background: var(--bg); }
  .btn-danger { color: var(--red); border-color: #fecdca; background: var(--red-soft); }
  .btn-danger:hover:not(:disabled) { background: #fee4e2; }
  .btn-block { width: 100%; justify-content: center; }

  /* ---------- 中栏 ---------- */
  .hero {
    position: relative;
    padding: 18px 20px;
    background: linear-gradient(120deg, #2563eb, #0ea5e9 70%, #06b6d4);
    color: #fff;
    border-radius: var(--radius) var(--radius) 0 0;
  }
  .hero-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .hero-title { font-size: 12.5px; opacity: .9; letter-spacing: .3px; }
  .hero-big { display: flex; align-items: baseline; gap: 8px; margin-top: 6px; }
  .hero-big .n { font-size: 40px; font-weight: 700; letter-spacing: -1px; line-height: 1; }
  .hero-big .u { font-size: 13px; opacity: .85; }
  .hero-meta { display: flex; gap: 22px; margin-top: 12px; flex-wrap: wrap; }
  .hero-meta .m { display: flex; flex-direction: column; gap: 1px; }
  .hero-meta .m b { font-size: 14px; font-weight: 600; }
  .hero-meta .m span { font-size: 11px; opacity: .82; }
  .hero-bar {
    margin-top: 14px; height: 4px; border-radius: 999px;
    background: rgba(255, 255, 255, .28); overflow: hidden;
  }
  .hero-bar > i {
    display: block; height: 100%; width: 34%; border-radius: 999px;
    background: #fff; opacity: .9;
    animation: slide 1.25s ease-in-out infinite;
  }
  @keyframes slide {
    0% { transform: translateX(-110%); }
    100% { transform: translateX(320%); }
  }
  .hero-bar[hidden] { display: none; }

  .toolbar {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    padding: 12px 16px; border-bottom: 1px solid var(--border); background: #fff;
  }
  .field { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--text-2); }
  .field input[type=number] {
    width: 78px; padding: 5px 8px; border: 1px solid var(--border-strong);
    border-radius: 8px; color: var(--text);
  }
  .field input[type=number]:focus { outline: 2px solid #c7d7fe; border-color: var(--accent); }
  .switch { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--text-2); }
  .settings-msg { font-size: 12px; }
  .toolbar .right { margin-left: auto; display: flex; align-items: center; gap: 10px; }

  .table-wrap { flex: 1 1 auto; overflow: auto; min-height: 0; position: relative; }
  table { width: 100%; border-collapse: collapse; }
  thead th {
    position: sticky; top: 0; z-index: 1;
    background: #fafbfc; color: var(--text-2); font-weight: 600; font-size: 12px;
    text-align: left; padding: 9px 14px; border-bottom: 1px solid var(--border);
    white-space: nowrap;
  }
  tbody td { padding: 9px 14px; border-bottom: 1px solid #f2f4f7; font-size: 13px; }
  tbody tr:hover { background: #fafbfc; }
  .empty-row td { text-align: center; color: var(--muted); padding: 40px 12px; }

  .badge {
    display: inline-block; padding: 1px 7px; border-radius: 6px;
    font-size: 11px; font-weight: 600; letter-spacing: .2px;
  }
  .badge-socks5 { background: var(--accent-soft); color: #1d4ed8; }
  .badge-mtproto { background: #f4f3ff; color: #6941c6; }
  .badge-unavailable { background: var(--bg); color: var(--text-2); }
  .lat { font-variant-numeric: tabular-nums; }
  .lat-green { color: var(--green); }
  .lat-orange { color: var(--amber); }
  .lat-red { color: var(--red); }
  .lat-none { color: var(--muted); }

  .link-btn {
    display: inline-flex; align-items: center; gap: 5px;
    background: none; border: 0; padding: 0; cursor: pointer;
    color: var(--text); font-variant-numeric: tabular-nums;
  }
  .link-btn:hover { color: var(--accent); }
  .link-btn.copied { color: var(--green); }
  .tg-btn {
    font-size: 12px; padding: 3px 10px; border-radius: 7px;
    border: 1px solid #a5d8f3; background: #f0f9ff; color: #0b7fb3; cursor: pointer;
  }
  .tg-btn:hover:not(:disabled) { background: #229ed9; border-color: #229ed9; color: #fff; }
  .tg-btn:disabled { opacity: .55; cursor: default; }

  .loading-overlay {
    position: absolute; inset: 0; background: rgba(255, 255, 255, .62);
    display: flex; align-items: center; justify-content: center;
    font-size: 12.5px; color: var(--text-2);
  }
  /* display:flex 会压过 UA 的 [hidden]{display:none}，必须显式补一条 */
  .loading-overlay[hidden] { display: none; }
  .main-body { position: relative; display: flex; flex-direction: column; flex: 1 1 auto; min-height: 0; }

  /* ---------- 右栏 ---------- */
  .panel-title {
    display: flex; align-items: baseline; justify-content: space-between; gap: 8px;
    font-size: 12px; font-weight: 650; letter-spacing: .3px; color: var(--text-2);
    margin-bottom: 8px;
  }
  .panel-title .hint { font-weight: 400; font-size: 11px; color: var(--muted); }

  .stage-row { margin-bottom: 9px; }
  .stage-head { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 3px; }
  .stage-head .t { color: var(--text-2); }
  .stage-head .v { font-variant-numeric: tabular-nums; color: var(--text); }
  .stage-track { height: 6px; border-radius: 999px; background: #f2f4f7; overflow: hidden; }
  .stage-track > i { display: block; height: 100%; border-radius: 999px; }
  .c-fetch { background: #0ea5e9; }
  .c-prepare { background: #94a3b8; }
  .c-tcp { background: #2563eb; }
  .c-tg { background: #7c3aed; }
  .c-commit { background: #16a34a; }

  .gate-list { display: flex; flex-direction: column; gap: 7px; }
  .gate-row { display: flex; align-items: center; gap: 8px; font-size: 12.5px; }
  .gate-row .name { flex: 1 1 auto; color: var(--text-2); }
  .gate-row .cnt { font-variant-numeric: tabular-nums; font-weight: 600; }
  .gate-row .p50 { width: 62px; text-align: right; color: var(--muted); font-size: 11.5px; font-variant-numeric: tabular-nums; }
  .swatch { width: 8px; height: 8px; border-radius: 2px; flex: none; }

  /* 运行日志：右栏窄，一行内塞下「时间 / 成败 / 摘要 / 耗时」 */
  .round-list { display: flex; flex-direction: column; gap: 2px; max-height: 248px; overflow-y: auto; }
  .round-row {
    display: flex; align-items: center; gap: 6px; font-size: 12px;
    padding: 4px 0; border-bottom: 1px dashed var(--border);
  }
  .round-row:last-child { border-bottom: 0; }
  .round-row .ts { color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .round-row .tag {
    flex: none; font-size: 10.5px; font-weight: 700; line-height: 1.5;
    padding: 0 5px; border-radius: 5px;
  }
  .round-row .tag.ok { color: var(--green); background: var(--green-soft); }
  .round-row .tag.fail { color: var(--red); background: var(--red-soft); }
  .round-row .sum {
    flex: 1 1 auto; min-width: 0; color: var(--text-2);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .round-row .warn { color: var(--amber); flex: none; }
  .round-row .dur { color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }

  .source-row { display: flex; align-items: center; gap: 7px; font-size: 12px; padding: 3px 0; }
  .source-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); flex: none; }
  .source-link {
    color: var(--text-2); text-decoration: none; overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap; max-width: 182px;
  }
  .source-link:hover { color: var(--accent); text-decoration: underline; }
  .source-note { font-size: 11px; margin-left: auto; white-space: nowrap; }

  .notice-box {
    font-size: 12px; line-height: 1.5; padding: 8px 10px; border-radius: 9px;
    background: var(--amber-soft); color: #b54708; border: 1px solid #fedf89;
  }
  .error-banner {
    position: fixed; left: 16px; right: 16px; bottom: 16px; z-index: 30;
    padding: 10px 14px; border-radius: 10px; font-size: 12.5px;
    background: var(--red-soft); color: #b42318; border: 1px solid #fecdca;
    box-shadow: 0 6px 18px rgba(16, 24, 40, .12);
  }
  .error-banner[hidden] { display: none; }
  .quit-screen { padding: 80px 24px; text-align: center; color: var(--text-2); }

  /* tg:// 唤起失败时的复制兜底（协议未注册时 os.startfile 会静默失败） */
  .tg-fallback {
    position: fixed; left: 16px; right: 16px; bottom: 72px; z-index: 31;
    background: #fff; border: 1px solid var(--border-strong); border-radius: 10px;
    box-shadow: 0 8px 24px rgba(16, 24, 40, .16); padding: 12px 14px;
  }
  .tg-fallback[hidden] { display: none; }
  .tg-fallback .row {
    display: flex; align-items: center; gap: 10px; margin-bottom: 8px;
  }
  .tg-fallback .msg { flex: 1 1 auto; font-size: 12.5px; color: #b54708; }
  .tg-fallback input {
    width: 100%; padding: 7px 9px; border: 1px solid var(--border-strong);
    border-radius: 8px; font-size: 12px; color: var(--text-2); background: #fafbfc;
    font-family: ui-monospace, Consolas, monospace;
  }
</style>
</head>
<body>

<div class="app" id="app">
  <!-- 左栏 -->
  <aside class="col col-left">
    <div class="brand">
      <span class="brand-name">TGProxy</span>
      <span class="brand-ver" id="app-version">v—</span>
    </div>
    <div class="status-pill" id="status-pill"><span class="dot"></span><span id="status-text">空闲</span></div>

    <div class="side-block">
      <div class="side-label">可用节点</div>
      <div class="big-num num" id="big-available">—</div>
      <div class="big-sub" id="big-available-sub">等待首轮结果</div>
    </div>

    <div class="side-block">
      <div class="kv"><span class="k">上轮耗时</span><span class="num" id="side-duration">—</span></div>
      <div class="kv"><span class="k">本轮测数</span><span class="num" id="side-tested">—</span></div>
      <div class="kv"><span class="k">更新时间</span><span class="num" id="side-updated">—</span></div>
    </div>

    <div class="spacer"></div>
    <button class="btn btn-block" id="toggle-right" type="button">显示耗时明细</button>
    <button class="btn btn-danger btn-block" id="exit-btn" type="button" title="停止服务并退出程序">退出程序</button>
  </aside>

  <!-- 中栏 -->
  <main class="col col-main">
    <section class="hero">
      <div class="hero-top">
        <span class="hero-title" id="hero-title">当前状态</span>
        <span class="hero-title num" id="hero-countdown">下次自动更新：--</span>
      </div>
      <div class="hero-big">
        <span class="n num" id="hero-available">—</span>
        <span class="u">个可用节点</span>
      </div>
      <div class="hero-meta">
        <div class="m"><b class="num" id="hero-tested">—</b><span>本轮测试</span></div>
        <div class="m"><b class="num" id="hero-dropped">—</b><span>TCP 不通</span></div>
        <div class="m"><b class="num" id="hero-tgfailed">—</b><span>TG 未过/超门槛</span></div>
        <div class="m"><b class="num" id="hero-duration">—</b><span>上轮耗时</span></div>
      </div>
      <div class="hero-bar" id="hero-bar" hidden><i></i></div>
    </section>

    <div class="main-body">
      <div class="toolbar">
        <button id="refresh-btn" class="btn btn-primary" type="button">刷新</button>
        <div class="field">
          <label for="interval-input">间隔(分钟)</label>
          <input id="interval-input" type="number" min="1" max="1440" step="1" value="10">
        </div>
        <div class="field">
          <label for="tg-limit-input">TG 延迟上限(ms)</label>
          <input id="tg-limit-input" type="number" min="500" max="60000" step="100" value="1000">
        </div>
        <label class="switch"><input id="kg-enabled-input" type="checkbox" checked> 沉淀可用节点</label>
        <button id="save-interval-btn" class="btn" type="button">保存</button>
        <span id="settings-msg" class="settings-msg"></span>
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>类型</th><th>地址</th><th>延迟</th><th>地区</th><th>ISP</th><th>入库</th><th>操作</th>
            </tr>
          </thead>
          <tbody id="proxy-tbody"></tbody>
        </table>
        <div class="loading-overlay" id="loading-overlay" hidden>正在刷新…</div>
      </div>
    </div>
  </main>

  <!-- 右栏 -->
  <aside class="col col-right">
    <section>
      <div class="panel-title"><span>上轮阶段耗时</span><span class="hint" id="stage-total">—</span></div>
      <div id="stage-list"></div>
    </section>

    <section>
      <div class="panel-title"><span>TG 两关分布</span><span class="hint" id="gate-total">—</span></div>
      <div class="gate-list" id="gate-list"></div>
    </section>

    <section>
      <div class="panel-title"><span>数据源</span><span class="hint" id="source-summary">—</span></div>
      <div id="source-urls"></div>
      <div id="source-notice" class="notice-box" style="margin-top:8px" hidden></div>
    </section>

    <section>
      <div class="panel-title"><span>运行日志</span><span class="hint" id="round-count">—</span></div>
      <div class="round-list" id="round-list"></div>
    </section>
  </aside>
</div>

<div class="error-banner" id="error-banner" hidden></div>

<div class="tg-fallback" id="tg-fallback" hidden>
  <div class="row">
    <span class="msg" id="tg-fallback-msg"></span>
    <button class="btn" id="tg-copy-btn" type="button">复制链接</button>
    <button class="btn btn-ghost" id="tg-close-btn" type="button">关闭</button>
  </div>
  <input id="tg-link-input" type="text" readonly>
</div>

<script>
(function () {
  "use strict";

  var POLL_MS = 2500;
  var state = { settings: null, nextRunAt: null, fetching: false };
  var quitting = false;

  function $(id) { return document.getElementById(id); }

  var tbody = $("proxy-tbody");
  var refreshBtn = $("refresh-btn");
  var loadingOverlay = $("loading-overlay");
  var errorBanner = $("error-banner");
  var settingsMsg = $("settings-msg");

  var COPY_ICON =
    '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
    'stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
    '<rect x="9" y="9" width="13" height="13" rx="2"></rect>' +
    '<path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>';

  function escapeHtml(value) {
    return String(value == null ? "" : value).replace(/[&<>"']/g, function (ch) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch];
    });
  }

  function fetchJson(url, options) {
    return fetch(url, options).then(function (resp) {
      return resp.json().catch(function () { return {}; });
    });
  }

  function fmtDuration(sec) {
    if (sec == null || !isFinite(sec)) { return "—"; }
    if (sec < 60) { return sec.toFixed(2) + " s"; }
    var m = Math.floor(sec / 60);
    return m + " 分 " + Math.round(sec % 60) + " 秒";
  }

  function formatLatency(ms) {
    if (ms == null) { return { text: "—", cls: "lat-none" }; }
    if (ms < 1000) { return { text: ms + " ms", cls: "lat-green" }; }
    if (ms < 3000) { return { text: ms + " ms", cls: "lat-orange" }; }
    return { text: ms + " ms", cls: "lat-red" };
  }

  function typeBadge(type) {
    if (type === "mtproto") { return '<span class="badge badge-mtproto">MTProto</span>'; }
    return '<span class="badge badge-socks5">SOCKS5</span>';
  }

  /* ---------- 表格 ---------- */
  function renderProxies(proxies) {
    if (!proxies || !proxies.length) {
      tbody.innerHTML = '<tr class="empty-row"><td colspan="7">暂无可用代理，请点击「刷新」或等待自动更新</td></tr>';
      return;
    }
    var html = "";
    proxies.forEach(function (p) {
      var tgLat = p.tg_latency_ms;
      var lat = (tgLat != null) ? formatLatency(tgLat) : formatLatency(p.latency_ms);
      var latTitle = (tgLat != null) ? "TG 线路往返延迟" : "TCP 连接延迟";
      var unverified = (p.tg_ok === null) ? '<span class="badge badge-unavailable">未验证</span> ' : "";
      html += "<tr>" +
        "<td>" + typeBadge(p.type) + "</td>" +
        '<td><button type="button" class="link-btn" data-link="' + escapeHtml(p.link) +
          '" title="点击复制完整链接">' + escapeHtml(p.host + ":" + p.port) + COPY_ICON + "</button></td>" +
        '<td>' + unverified + '<span class="lat ' + lat.cls + '" title="' + latTitle + '">' + lat.text + "</span></td>" +
        "<td>" + escapeHtml(p.location) + "</td>" +
        "<td>" + escapeHtml(p.isp) + "</td>" +
        "<td>" + escapeHtml(p.added_at) + "</td>" +
        '<td><button type="button" class="tg-btn" data-host="' + escapeHtml(p.host) +
          '" data-port="' + escapeHtml(p.port) + '" title="唤起 Telegram Desktop 添加代理">添加到 Telegram</button></td>' +
        "</tr>";
    });
    tbody.innerHTML = html;
  }

  /* ---------- 左栏 / Hero ---------- */
  function renderSummary(data) {
    var stats = data.stats || {};
    var tested = (stats.available || 0) + (stats.unverified || 0) +
                 (stats.tg_failed || 0) + (stats.dropped || 0);
    var dur = (data.stage_durations && data.stage_durations.total) || null;
    var updated = data.updated_at;

    $("big-available").textContent = updated ? (stats.available || 0) : "—";
    $("big-available-sub").textContent = updated
      ? ("本轮测试 " + tested + " 个")
      : "等待首轮结果";
    $("side-duration").textContent = fmtDuration(dur);
    $("side-tested").textContent = updated ? tested : "—";
    $("side-updated").textContent = updated || "—";

    $("hero-available").textContent = updated ? (stats.available || 0) : "—";
    $("hero-tested").textContent = updated ? tested : "—";
    $("hero-dropped").textContent = updated ? (stats.dropped || 0) : "—";
    $("hero-tgfailed").textContent = updated ? (stats.tg_failed || 0) : "—";
    $("hero-duration").textContent = dur == null ? "—" : dur.toFixed(1) + "s";

    var fetching = !!data.fetching;
    $("status-text").textContent = fetching ? "刷新中" : "空闲";
    $("status-pill").className = "status-pill" + (fetching ? " running" : "");
    $("hero-title").textContent = fetching ? "正在刷新（耗时明细在本轮结束后更新）" : "上轮结果";
    $("hero-bar").hidden = !fetching;
  }

  function renderCountdown() {
    var el = $("hero-countdown");
    if (state.nextRunAt == null) { el.textContent = "下次自动更新：--"; return; }
    var remain = Math.max(0, Math.round((state.nextRunAt - Date.now()) / 1000));
    var text = remain >= 60
      ? Math.floor(remain / 60) + " 分 " + (remain % 60) + " 秒"
      : remain + " 秒";
    el.textContent = "下次自动更新：" + text;
  }

  /* ---------- 右栏：阶段耗时 ---------- */
  var STAGE_META = [
    { key: "fetch",   label: "抓取",   cls: "c-fetch" },
    { key: "prepare", label: "解析合并", cls: "c-prepare" },
    { key: "tcp",     label: "TCP 预筛", cls: "c-tcp" },
    { key: "tg",      label: "TG 实测",  cls: "c-tg" },
    { key: "commit",  label: "汇总落盘", cls: "c-commit" }
  ];

  function renderStages(durations) {
    var box = $("stage-list");
    durations = durations || {};
    var total = durations.total || 0;
    $("stage-total").textContent = total ? fmtDuration(total) : "—";
    if (!total) {
      box.innerHTML = '<div class="muted" style="font-size:12px">暂无数据，跑完一轮后显示</div>';
      return;
    }
    var html = "";
    STAGE_META.forEach(function (s) {
      var v = durations[s.key];
      if (v == null) { return; }
      var pct = total > 0 ? (v / total * 100) : 0;
      html += '<div class="stage-row">' +
        '<div class="stage-head"><span class="t">' + s.label + '</span>' +
        '<span class="v">' + v.toFixed(2) + 's · ' + pct.toFixed(0) + '%</span></div>' +
        '<div class="stage-track"><i class="' + s.cls + '" style="width:' +
          Math.max(1, pct).toFixed(1) + '%"></i></div></div>';
    });
    box.innerHTML = html;
  }

  /* ---------- 右栏：TG 两关分布 ---------- */
  var GATE_META = [
    { key: "dc_fail",          label: "连接 DC 失败", color: "#dc2626" },
    { key: "latency_rejected", label: "超门槛（已剪枝）", color: "#d97706" },
    { key: "web_fail",         label: "站点验证失败", color: "#7c3aed" },
    { key: "ok",               label: "两关通过", color: "#16a34a" }
  ];

  function renderGates(g) {
    var box = $("gate-list");
    g = g || {};
    $("gate-total").textContent = g.total ? (g.total + " 个节点") : "—";
    if (!g.total) {
      box.innerHTML = '<div class="muted" style="font-size:12px">暂无数据</div>';
      return;
    }
    var html = "";
    GATE_META.forEach(function (m) {
      var item = g[m.key] || { count: 0 };
      var p50 = item.dc_p50 != null ? item.dc_p50 + "ms" : "—";
      html += '<div class="gate-row">' +
        '<span class="swatch" style="background:' + m.color + '"></span>' +
        '<span class="name">' + m.label + '</span>' +
        '<span class="cnt">' + (item.count || 0) + '</span>' +
        '<span class="p50" title="第一关往返中位数">' + p50 + '</span>' +
        '</div>';
    });
    box.innerHTML = html;
  }

  /* ---------- 右栏：运行日志（rounds.jsonl 最近 20 轮） ---------- */
  /**
   * 后端只回最近 20 轮（磁盘留 50 条，状态里只带 20 条，省得每次轮询多背 10KB）。
   * 新的排上面：`rounds` 是旧 → 新，这里 reverse。
   * 成功轮也可能带 error（如「本轮 0 达标已保留旧列表」），那种情况用 ⚠ 标出来，
   * 完整文案放 title —— 右栏一行塞不下，但也不能当没发生。
   */
  function renderRounds(rounds) {
    var box = $("round-list");
    rounds = rounds || [];
    $("round-count").textContent = rounds.length ? (rounds.length + " 轮") : "—";
    if (!rounds.length) {
      box.innerHTML = '<div class="muted" style="font-size:12px">还没有轮次记录，跑完一轮后显示</div>';
      return;
    }
    var html = "";
    rounds.slice().reverse().forEach(function (r) {
      var s = r.stats || {};
      var note = r.error || "";
      var sum = r.ok
        ? ("可用 " + (s.available || 0) + " / 测 " + (s.tested || 0))
        : (note || "未完成");
      html += '<div class="round-row" title="' + escapeHtml(r.ts + (note ? " · " + note : "")) + '">' +
        '<span class="ts">' + escapeHtml(String(r.ts || "").slice(5)) + '</span>' +
        '<span class="tag ' + (r.ok ? "ok" : "fail") + '">' + (r.ok ? "成功" : "失败") + '</span>' +
        '<span class="sum">' + escapeHtml(sum) + '</span>' +
        (r.ok && note ? '<span class="warn" title="' + escapeHtml(note) + '">⚠</span>' : '') +
        '<span class="dur">' + fmtDuration((r.elapsed_ms || 0) / 1000) + '</span>' +
        '</div>';
    });
    box.innerHTML = html;
  }

  /* ---------- 右栏：数据源 ---------- */
  /**
   * raw.githubusercontent.com 在国内直连打不开，点链接等于点了没反应。
   * 换成 jsDelivr 镜像（与后端 mirror_urls 的规则一致），保证点得开。
   */
  function mirrorUrl(url) {
    var m = /^https?:\/\/raw\.githubusercontent\.com\/([^/]+)\/([^/]+)\/([^/]+)\/(.+)$/.exec(url);
    if (!m) { return url; }
    return "https://cdn.jsdelivr.net/gh/" + m[1] + "/" + m[2] + "@" + m[3] + "/" + m[4];
  }

  function renderSourceUrls(urls) {
    var box = $("source-urls");
    box.innerHTML = "";
    urls.forEach(function (url, index) {
      var row = document.createElement("div");
      row.className = "source-row";
      var dot = document.createElement("span");
      dot.className = "source-dot";
      dot.id = "source-dot-" + index;
      row.appendChild(dot);
      var link = document.createElement("a");
      var target = mirrorUrl(url);
      link.href = target;
      link.textContent = url.replace(/^https?:\/\//, "");
      link.target = "_blank";
      link.rel = "noopener";
      link.className = "source-link";
      if (target !== url) {
        link.title = "GitHub 直连不可用，点击打开 jsDelivr 镜像\n" + target;
      }
      row.appendChild(link);
      var note = document.createElement("span");
      note.className = "source-note muted";
      note.id = "source-note-" + index;
      row.appendChild(note);
      box.appendChild(row);
    });
  }

  function renderSources(sources) {
    var ok = 0;
    (sources || []).forEach(function (src, index) {
      var dot = $("source-dot-" + index);
      var note = $("source-note-" + index);
      if (src.status === "ok") { ok += 1; }
      if (!dot || !note) { return; }
      if (src.status === "ok") {
        dot.style.background = "#16a34a";
        note.textContent = src.kept + " 条" + (src.via_mirror ? " · 镜像" : "");
      } else {
        dot.style.background = "#dc2626";
        note.textContent = "失败";
        note.title = src.error ? String(src.error).slice(0, 200) : "";
      }
    });
    var total = (sources || []).length;
    $("source-summary").textContent = total ? (ok + "/" + total + " 成功") : "—";
  }

  function renderNotice(notice) {
    var box = $("source-notice");
    if (notice) { box.textContent = notice; box.hidden = false; }
    else { box.hidden = true; }
  }

  /* ---------- 主渲染 ---------- */
  function render(data) {
    renderSummary(data);
    renderProxies(data.proxies);
    renderSources(data.sources);
    renderStages(data.stage_durations);
    renderGates(data.tg_gate_stats);
    renderRounds(data.rounds);
    renderNotice(data.notice);

    if (data.error) { errorBanner.textContent = data.error; errorBanner.hidden = false; }
    else { errorBanner.hidden = true; }

    state.fetching = !!data.fetching;
    setRefreshingUi(state.fetching);
    if (typeof data.next_run_in_sec === "number") {
      state.nextRunAt = Date.now() + data.next_run_in_sec * 1000;
      renderCountdown();
    }
  }

  function poll() {
    if (quitting) { return; }
    fetchJson("/api/proxies").then(render).catch(function () { /* 服务未就绪，下轮重试 */ });
  }

  function setRefreshingUi(refreshing) {
    refreshBtn.disabled = refreshing;
    refreshBtn.textContent = refreshing ? "刷新中…" : "刷新";
    loadingOverlay.hidden = !refreshing;
  }

  function refresh() {
    setRefreshingUi(true);
    fetchJson("/api/refresh", { method: "POST" }).catch(function () { setRefreshingUi(false); });
  }

  function loadSettings() {
    fetchJson("/api/settings").then(function (data) {
      state.settings = data;
      $("interval-input").value = data.interval_minutes;
      $("tg-limit-input").value = data.max_tg_latency_ms;
      $("kg-enabled-input").checked = !!data.known_good_enabled;
      renderSourceUrls(data.proxy_list_urls || []);
    }).catch(function () { /* 用输入框默认值 */ });
  }

  function saveSettings() {
    var value = parseInt($("interval-input").value, 10);
    if (isNaN(value) || value < 1 || value > 1440) {
      settingsMsg.style.color = "#dc2626";
      settingsMsg.textContent = "间隔请输入 1~1440 之间的整数";
      return;
    }
    var tgLimit = parseInt($("tg-limit-input").value, 10);
    if (isNaN(tgLimit) || tgLimit < 500 || tgLimit > 60000) {
      settingsMsg.style.color = "#dc2626";
      settingsMsg.textContent = "TG 延迟上限请在 500~60000 之间";
      return;
    }
    fetchJson("/api/settings", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        interval_minutes: value,
        max_tg_latency_ms: tgLimit,
        known_good_enabled: $("kg-enabled-input").checked
      })
    }).then(function (data) {
      if (data && data.ok) {
        settingsMsg.style.color = "#16a34a";
        settingsMsg.textContent = "已保存，立即生效";
        if (data.settings) { $("interval-input").value = data.settings.interval_minutes; }
      } else {
        settingsMsg.style.color = "#dc2626";
        settingsMsg.textContent = (data && data.error) || "保存失败";
      }
    }).catch(function () {
      settingsMsg.style.color = "#dc2626";
      settingsMsg.textContent = "保存失败：网络错误";
    });
  }

  function fallbackCopy(text) {
    var ta = document.createElement("textarea");
    ta.value = text;
    ta.setAttribute("readonly", "");
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    var ok = false;
    try { ok = document.execCommand("copy"); } catch (err) { ok = false; }
    document.body.removeChild(ta);
    return ok;
  }

  function copyText(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      return navigator.clipboard.writeText(text)
        .then(function () { return true; })
        .catch(function () { return fallbackCopy(text); });
    }
    return Promise.resolve(fallbackCopy(text));
  }

  /* ---------- 事件 ---------- */
  tbody.addEventListener("click", function (event) {
    var btn = event.target.closest ? event.target.closest(".link-btn") : null;
    if (!btn) { return; }
    copyText(btn.getAttribute("data-link")).then(function (ok) {
      if (!ok) { return; }
      btn.classList.add("copied");
      setTimeout(function () { btn.classList.remove("copied"); }, 1200);
    });
  });

  tbody.addEventListener("click", function (event) {
    var btn = event.target.closest ? event.target.closest(".tg-btn") : null;
    if (!btn || btn.disabled) { return; }
    btn.disabled = true;
    fetchJson("/api/open_telegram", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ host: btn.getAttribute("data-host"), port: btn.getAttribute("data-port") })
    }).then(function (data) {
      if (data && data.ok) {
        btn.textContent = "已唤起 Telegram";
        return;
      }
      // 协议未注册时后端会带回 tg:// 链接，改为手动复制兜底
      if (data && data.url) {
        showTgFallback(data.error || "无法自动唤起 Telegram", data.url, data.hint);
        btn.textContent = "请手动复制";
      } else {
        btn.textContent = (data && data.error) ? String(data.error).slice(0, 24) : "唤起失败";
      }
      setTimeout(function () { btn.textContent = "添加到 Telegram"; btn.disabled = false; }, 2500);
    }).catch(function () {
      btn.textContent = "唤起失败";
      setTimeout(function () { btn.textContent = "添加到 Telegram"; btn.disabled = false; }, 2500);
    });
  });

  function showTgFallback(message, url, hint) {
    $("tg-fallback-msg").textContent = hint ? (message + " — " + hint) : message;
    $("tg-link-input").value = url;
    $("tg-fallback").hidden = false;
    $("tg-link-input").select();
  }

  refreshBtn.addEventListener("click", refresh);
  $("save-interval-btn").addEventListener("click", saveSettings);

  $("tg-copy-btn").addEventListener("click", function () {
    var input = $("tg-link-input");
    input.select();
    copyText(input.value).then(function (ok) {
      this.textContent = ok ? "已复制" : "复制失败，请手动选中";
      var self = this;
      setTimeout(function () { self.textContent = "复制链接"; }, 1600);
    }.bind(this));
  });
  $("tg-close-btn").addEventListener("click", function () {
    $("tg-fallback").hidden = true;
  });

  $("toggle-right").addEventListener("click", function () {
    var app = $("app");
    var shown = app.classList.toggle("show-right");
    this.textContent = shown ? "隐藏耗时明细" : "显示耗时明细";
  });

  $("exit-btn").addEventListener("click", function () {
    if (!confirm("退出 TGProxy？服务会停止，下次需要重新双击启动。")) { return; }
    quitting = true;
    fetchJson("/api/shutdown", { method: "POST" })
      .catch(function () { return {}; })
      .then(function () {
        document.body.innerHTML =
          '<div class="quit-screen">TGProxy 已退出，可以关闭此页面。</div>';
      });
  });

  document.addEventListener("visibilitychange", function () {
    if (!document.hidden) { poll(); }
  });

  /* ---------- 启动 ---------- */
  fetchJson("/api/version").then(function (v) {
    $("app-version").textContent = "v" + (v && v.version ? v.version : "—");
  }).catch(function () { $("app-version").textContent = "v—"; });

  loadSettings();
  poll();
  setInterval(poll, POLL_MS);
  setInterval(renderCountdown, 1000);
})();
</script>
</body>
</html>
